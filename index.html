    <canvas id="stars"></canvas>

    <script>
let treesizing;

function getBrowser() {
    if (navigator.userAgent.indexOf("Chrome") != -1) {
        treesizing = "52vh";
        console.log("chrome")
    } else {
        treesizing = "62vh";
    }

    document.documentElement.style.setProperty("--treesizing", treesizing);
}
getBrowser()

        function start_canva() {
        
        const canvas = document.getElementById("stars");
        const ctx = canvas.getContext("2d")
        canvas.width = window.innerWidth
        canvas.height = window.innerHeight
        
       
        

        let star = []
        let shootingstar = []
        if (window.innerWidth > 4000) {
           console.log("67")

        }
        
        
        star.length = 0;
        console.log(star)
        let timer = 0;
        let nextSpawn = Math.random() * 300 + 10;
        for (let i = 0; i < 200; i++) {
            let x = Math.random() * canvas.width;
            let y = Math.random() * canvas.height;
            let speed = Math.random() * 1 + 0.3
            let size = Math.random() * 2 + 1 
            let brightness = 0
            let parralax = 0
            ctx.beginPath();
            ctx.arc(x, y, 3, 0, Math.PI * 2);
            ctx.fillStyle = "white";
            ctx.fill();
            star.push([x, y, speed, size, brightness, parralax])
            shootingstar.push([x, y])
        }
        
        
        
        function clear() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        }




function shootingstars() {
    ctx.beginPath();
    ctx.arc(shootingstar[0][0], shootingstar[0][1], 5, 0, Math.PI * 2);
    ctx.fillStyle = "white";
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(shootingstar[0][0], shootingstar[0][1])
    ctx.lineTo(shootingstar[0][0] -100, shootingstar[0][1]-100)
    ctx.lineWidth = 8;
    let gradient = ctx.createLinearGradient(shootingstar[0][0], shootingstar[0][1], shootingstar[0][0] -70, shootingstar[0][1]-70)
    ctx.strokeStyle = gradient;
    gradient.addColorStop(0, "white");
    gradient.addColorStop(1, "transparent");
    ctx.stroke()

    shootingstar[0][0] += 2;
    shootingstar[0][1] += 2;
}


        
        
        function move(timestamp) {
            clear()
            
            for (let i = 0; i < 200; i++) {
                if (canvas.height < star[i][1]) {
                    star[i][1] = 0 
                }
                star[i][1] += star[i][2]
                ctx.beginPath();
                if (star[i][3] < 2.5 && star[i][2] < 0.025) {
                 star[i][2] -= 0.001
                }
                 if (star[i][3] < 2 && star[i][2] < 0.65) {
                 star[i][2] += 0.0005
                }
                
                ctx.arc(star[i][0], star[i][1], star[i][3], 0, Math.PI * 2);
                ctx.globalAlpha = Math.random() + 0.77;
                ctx.fillStyle = "white";
                ctx.fill();
            }
            timer = timer+1 
            console.log(timer)
            if (shootingstar[0][1] > canvas.height) {
    console.log("SHOOTING STAR");
    shootingstar[0][0] = Math.random() * canvas.width;
    shootingstar[0][1] = 0;
}
 shootingstars() 
            requestAnimationFrame(move);
        }
        move() 
        
         function fixcanva() {
            console.log("resized")
            canvas.width = window.innerWidth
            canvas.height = window.innerHeight

            
        }
    }
    start_canva()
    window.addEventListener("resize", start_canva, false);

    </script>
